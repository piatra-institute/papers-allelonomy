- id: relational-autonomy
  kind: source
  passage: 'The relational-autonomy literature made the point systematic: the competencies that constitute autonomy,
    including self-trust, self-knowledge and the ability to weigh reasons, develop and persist within relations
    and institutions, which can sustain them or destroy them [@mackenzie2000].'
  evidence:
    citation_id: mackenzie2000
    locator: Book abstract
    verified: true
    verification_note: 'OUP abstract of DOI 10.1093/oso/9780195123333.001.0001: essays on the social and relational
      dimensions of autonomy and how oppression can impair an agent''s capacity for autonomy.'
- id: pettit-nondomination
  kind: source
  passage: 'Pettit relocated unfreedom from interference to arbitrary power: a person is unfree when another holds
    uncontrolled power over their conditions of action, and free when that power is checked, whether or not it is
    exercised [@pettit1999].'
  evidence:
    citation_id: pettit1999
    locator: Book abstract
    verified: true
    verification_note: 'OUP abstract of DOI 10.1093/0198296428.001.0001: freedom as non-domination, distinct from
      non-interference and self-mastery.'
- id: sloterdijk-formation
  kind: source
  passage: 'Sloterdijk''s observation that humanism was always a practice of forming humans [@sloterdijk2009] supports
    one limited point: formation is universal, and the problem lies in formation that is disavowed.'
  evidence:
    citation_id: sloterdijk2009
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.1068/dst3: humanism as taming humans into citizens through reading.'
- id: schelling-segregation
  kind: source
  passage: Schelling showed that mild local preferences, with no one wanting more than a modestly better neighbourhood,
    generate strong aggregate segregation that no participant intends [@schelling1971].
  evidence:
    citation_id: schelling1971
    locator: Abstract
    verified: true
    verification_note: 'OpenAlex abstract of DOI 10.1080/0022250x.1971.9989794: interactive dynamics of individual
      choices produce exaggerated separation with no simple correspondence to individual incentives.'
- id: young-connection
  kind: source
  passage: 'Young''s social connection model describes responsibility in such a structure: where injustice results
    from the ordinary, lawful acts of many connected participants, responsibility does not require a guilty author
    and falls, in a forward-looking and political form, on those whose practices reproduce the outcome [@young2006].'
  evidence:
    citation_id: young2006
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.1017/s0265052506060043: all agents who contribute by their actions
      to structural processes that produce injustice have responsibilities to remedy them.'
- id: nguyen-echo
  kind: source
  passage: Nguyen's echo chambers pre-emptively discredit contrary voices, so that exposure to rebuttal increases
    members' confidence [@nguyen2020].
  evidence:
    citation_id: nguyen2020
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract of DOI 10.1017/epi.2018.32: echo chambers actively exclude and discredit
      outside voices, members systematically distrust outside sources. The claim that exposure to rebuttal increases
      confidence is from the article body and was not re-read.'
- id: collins-expertise
  kind: source
  passage: These numbers correspond to O'Neill's argument that the proper aim is trustworthiness and not trust [@oneill2002],
    to Longino's account of objectivity as organized criticism [@longino1990], and to Collins and Evans's view that
    expertise is real and unequally distributed and needs institutions that neither level it nor place it beyond
    challenge [@collins2002].
  evidence:
    citation_id: collins2002
    locator: Abstract
