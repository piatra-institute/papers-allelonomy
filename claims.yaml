- id: abs-gap-sov
  kind: computation
  passage: In a two-site formation loop, mild private preference for better peers stratifies capacities with no
    planner, reaching a gap of 0.28 by generation 25; a standing commitment by part of the advantaged to stay reduces
    the gap to 0.13 at a cost of 0.04 per committed family per generation.
  evidence:
    file: simulation/output/results.json
    run_id: model
    pointer: /formation/sovereign/final_gap
    reported: '0.28'
    units: capacity gap between sites
    conditions: 'formation model: 1000 agents, 2 sites, 25 generations, seed 0'
    decimals: 2
